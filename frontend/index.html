<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Esports Management System - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Esports Management System</h1>


    <!-- LOGIN -->
    <section>

        <h2>User Login</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

        <p id="loginMessage"></p>

    </section>


    <!-- SIGNUP -->
    <section>

        <h2>New User? Sign Up</h2>

        <input
            type="text"
            id="signupUsername"
            placeholder="Username"
        >

        <input
            type="email"
            id="signupEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="signupPassword"
            placeholder="Password"
        >

        <button onclick="signup()">
            Sign Up
        </button>

        <p id="signupMessage"></p>

    </section>


    <script src="script.js"></script>

</body>
</html>
